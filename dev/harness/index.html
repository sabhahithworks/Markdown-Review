<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Review — layout harness</title>
  <!--
    The review pane's card layout has never been rendered by a layout engine: jsdom reports every
    rectangle as zero, so `media/test/comments.test.ts` can only exercise the pure `stackTops`.
    This page runs the real `media/webview.js` in a real browser, driven by real messages, over
    markup produced by the real host renderer (see generate.mjs).

    The body below reproduces `ReviewPanel.getHtmlForWebview` element for element. It deliberately
    does NOT reproduce the CSP: a webview's CSP is enforced by VS Code, and nothing here can stand
    in for that — the CSP check stays on the manual F5 list.

    Serve it, do not open it as a file://:
        python3 -m http.server 8901
        http://localhost:8901/dev/harness/
  -->
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="../../media/webview.css">
  <style>
    /*
     * Harness chrome only. Hardcoded colours are fine here and nowhere else — this file is not
     * scanned by scripts/check-css-colors.mjs and never ships.
     */
    #mr-harness {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 999;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 8px 12px;
      font: 12px/1.5 ui-monospace, monospace;
      color: #ddd;
      background: #111;
      border-top: 2px solid #444;
    }
    #mr-harness select,
    #mr-harness button {
      font: inherit;
      color: #ddd;
      background: #222;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 6px;
    }
    #mr-log {
      flex: 1;
      max-height: 9em;
      overflow: auto;
      white-space: pre-wrap;
      margin: 0;
    }
    #mr-log .fail { color: #ff8080; }
    #mr-log .pass { color: #86e08a; }
  </style>
</head>
<body>
  <!-- Kept element-for-element identical to `getHtmlForWebview`. `requireElement` throws on a
       missing id, so a shell that drifts fails loudly on load instead of rendering subtly wrong. -->
  <!-- This shell must stay identical to `ReviewPanel.getHtmlForWebview`'s: the real bundle calls
       `requireElement` for each id and throws on the first one missing, so a shell that has drifted
       does not degrade — it stops the webview booting, and every check below then passes vacuously
       or fails for the wrong reason. -->
  <header id="header" hidden></header>
  <div id="notice" hidden></div>
  <section id="orphans" hidden aria-label="Comments that lost their anchor"></section>
  <div id="empty-state" hidden></div>
  <div id="front-matter-root"></div>
  <main id="content"></main>
  <div id="highlight-overlay" aria-hidden="true"></div>
  <div id="marker-layer"></div>
  <aside id="gutter" aria-label="Comments"></aside>
  <div id="announcer" class="mr-visually-hidden" role="status" aria-live="polite"></div>

  <div id="mr-harness" data-no-anchor>
    <div>
      <label>theme
        <select id="mr-theme">
          <option value="dark">Dark+</option>
          <option value="light">Light+</option>
          <option value="hc">HC Dark</option>
        </select>
      </label><br>
      <label>scenario
        <select id="mr-scenario"></select>
      </label><br>
      <button id="mr-check" type="button">Run checks</button>
      <button id="mr-gestures" type="button">Run gestures</button>
    </div>
    <pre id="mr-log"></pre>
  </div>

  <script src="fixture.js"></script>
  <script>
    // ---- the vscode API the webview expects, before the bundle that calls it ------------------
    window.__POSTED__ = [];
    let state = null;
    window.acquireVsCodeApi = () => ({
      postMessage(message) { window.__POSTED__.push(message); },
      getState() { return state; },
      setState(next) { state = next; },
    });

    window.__ERRORS__ = [];
    window.addEventListener('error', (event) => window.__ERRORS__.push(event.message));
    window.addEventListener('unhandledrejection', (event) => window.__ERRORS__.push(String(event.reason)));
  </script>
  <script src="../../media/webview.js"></script>
  <script>
  (() => {
    const fixture = window.__FIXTURE__;
    const log = document.getElementById('mr-log');
    const themeSelect = document.getElementById('mr-theme');
    const scenarioSelect = document.getElementById('mr-scenario');

    function write(line, kind) {
      const span = document.createElement('span');
      if (kind) span.className = kind;
      span.textContent = `${line}\n`;
      log.append(span);
      log.scrollTop = log.scrollHeight;
    }

    for (const [key, scenario] of Object.entries(fixture.scenarios)) {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = scenario.label;
      scenarioSelect.append(option);
    }

    function post(message) { window.postMessage(message, '*'); }

    let currentKey = 'basic';

    function loadScenario(key) {
      currentKey = key;
      const scenario = fixture.scenarios[key];
      post({ type: 'setContent', html: fixture.html, frontMatterHtml: fixture.frontMatterHtml });
      post({ type: 'reviewState', review: scenario.review, located: scenario.located, sectionChanged: scenario.sectionChanged ?? [] });
      // Only the host can detect a rewrite — it needs the state from *before* the re-anchor pass —
      // so the scenario declares the outcome and the page plays the host's part.
      if (scenario.rewriteDetected) {
        post({ type: 'rewriteDetected', orphaned: scenario.rewriteDetected });
      }
    }

    // The webview posts `ready` synchronously as its bundle finishes, so by the time this script
    // runs the message is already sitting in __POSTED__ — exactly as the host would find it.
    post({ type: 'init', targetPath: fixture.targetPath, author: fixture.author });
    loadScenario(currentKey);

    themeSelect.addEventListener('change', () => {
      document.documentElement.dataset.theme = themeSelect.value;
      // Colour changes cannot move layout, but the reposition is free and keeps the two in step.
      post({ type: 'reviewState', review: fixture.scenarios[currentKey].review, located: fixture.scenarios[currentKey].located, sectionChanged: fixture.scenarios[currentKey].sectionChanged ?? [] });
    });
    scenarioSelect.addEventListener('change', () => loadScenario(scenarioSelect.value));

    // ---- checks -------------------------------------------------------------------------------

    // Laid-out cards only: `hidden` covers narrow mode, and a zero height covers the resolved cards
    // sitting inside a collapsed <details>, which are in the DOM but occupy nothing.
    function visibleCards() {
      return [...document.querySelectorAll('#gutter .mr-card')].filter(
        (card) => !card.hidden && card.getBoundingClientRect().height > 0,
      );
    }

    const pass = (detail) => ({ verdict: 'PASS', detail });
    const fail = (detail) => ({ verdict: 'FAIL', detail });
    const skip = (detail) => ({ verdict: 'SKIP', detail });

    /**
     * True when no comment in the scenario can be located.
     *
     * A rewritten document has no highlights and no gutter cards *by design*, so the geometry
     * checks have to bail out rather than report the demonstrated behaviour as a failure.
     */
    function nothingLocatable() {
      return Object.values(fixture.scenarios[currentKey].located).every((position) => !position);
    }

    const checks = {
      'cards do not overlap'() {
        if (nothingLocatable()) return skip('every anchor in this scenario is gone');
        const rects = visibleCards()
          .map((card) => card.getBoundingClientRect())
          .sort((a, b) => a.top - b.top);
        for (let i = 1; i < rects.length; i++) {
          const previous = rects[i - 1];
          const current = rects[i];
          if (current.top < previous.bottom - 0.5) {
            return fail(`card ${i} starts at ${current.top.toFixed(1)} but the previous ends at ${previous.bottom.toFixed(1)}`);
          }
        }
        return pass(`${rects.length} card(s), no overlap`);
      },

      'overlapping anchors actually displace cards'() {
        // Without this, "cards do not overlap" would pass trivially on a scenario whose anchors
        // were never close enough to collide — it has to be shown that `stackTops` did something.
        if (currentKey !== 'stacking' || document.body.classList.contains('mr-narrow')) {
          return skip('needs the stacking scenario at full width');
        }
        let pushed = 0;
        for (const comment of fixture.scenarios.stacking.review.comments) {
          const mark = document.querySelector(`#highlight-overlay .mr-highlight[data-comment-id="${comment.id}"]`);
          const card = visibleCards().find((element) => element.textContent.includes(comment.body.slice(0, 20)));
          if (!mark || !card) return fail(`no highlight or card for ${comment.id}`);
          // Both rects are viewport-relative, so they compare directly.
          if (card.getBoundingClientRect().top > mark.getBoundingClientRect().top + 1) pushed++;
        }
        if (pushed === 0) return fail('no card was pushed down, so the stacking pass never ran');
        return pass(`${pushed} of 3 cards displaced below their anchor`);
      },

      'cards follow document order, whatever order they were created in'() {
        // The H1 regression guard. `render()` appends cards sorted by anchor start, but the
        // stacking pass collected them in *store* order — so a comment made on an early paragraph
        // after one on a late paragraph entered `stackTops` out of order and was shoved below the
        // later card's bottom, far from its own highlight. Every other scenario declares its
        // comments in document order, which is exactly why this went unseen; `outOfOrder` declares
        // them reversed.
        if (document.body.classList.contains('mr-narrow')) return skip('needs full width');
        const scenario = fixture.scenarios[currentKey];

        const pairs = [];
        for (const comment of scenario.review.comments) {
          const mark = document.querySelector(`#highlight-overlay .mr-highlight[data-comment-id="${comment.id}"]`);
          const card = visibleCards().find((element) => element.textContent.includes(comment.body.slice(0, 20)));
          if (!mark || !card) continue;
          pairs.push({ id: comment.id, markTop: mark.getBoundingClientRect().top, cardTop: card.getBoundingClientRect().top });
        }
        if (pairs.length < 2) return skip('needs at least two placed cards');

        pairs.sort((a, b) => a.markTop - b.markTop);
        for (let i = 1; i < pairs.length; i++) {
          if (pairs[i].cardTop < pairs[i - 1].cardTop - 0.5) {
            return fail(`${pairs[i].id}'s card sits above ${pairs[i - 1].id}'s, but its highlight is below`);
          }
        }
        // A card is never *above* its own anchor — stacking only ever pushes down.
        for (const pair of pairs) {
          if (pair.cardTop < pair.markTop - 1) {
            return fail(`${pair.id}'s card is ${(pair.markTop - pair.cardTop).toFixed(1)}px above its highlight`);
          }
        }
        return pass(`${pairs.length} card(s) in document order`);
      },

      'cards have a usable width'() {
        if (nothingLocatable()) return skip('every anchor in this scenario is gone');
        // Deliberately not compared against `window.innerWidth`: narrow mode can be forced by
        // overriding that getter when the window manager refuses a resize, and then it no longer
        // describes the real layout. "Escapes the pane" above is the honest overflow check.
        for (const card of visibleCards()) {
          const width = card.getBoundingClientRect().width;
          if (width < 40) return fail(`a card is only ${width.toFixed(1)}px wide`);
        }
        return pass(`${visibleCards().length} card(s) laid out`);
      },

      'nothing in the gutter escapes the pane'() {
        // Measured against the body's border box, not its content box: in wide mode the gutter
        // deliberately lives inside the right padding `body:not(.mr-narrow)` reserves for it. The
        // real failure is escaping the *pane* — which is what happens in narrow mode when `#gutter`
        // stops being a containing block and anything left `position: absolute; width: 100%` inside
        // it resolves against the page instead.
        const right = document.body.getBoundingClientRect().right;
        for (const element of document.querySelectorAll('#gutter .mr-card, #gutter .mr-resolved-group, #orphans > *, #header')) {
          const rect = element.getBoundingClientRect();
          if (rect.height === 0) continue;
          if (rect.right > right + 1) {
            return fail(`${element.className} ends at ${rect.right.toFixed(1)}, past the pane edge at ${right.toFixed(1)}`);
          }
        }
        return pass(`within ${right.toFixed(0)}px`);
      },

      'highlights have real geometry'() {
        if (nothingLocatable()) return skip('every anchor in this scenario is gone');
        const marks = [...document.querySelectorAll('#highlight-overlay .mr-highlight')];
        if (marks.length === 0) return fail('no highlights drawn');
        for (const mark of marks) {
          const rect = mark.getBoundingClientRect();
          if (rect.width < 1 || rect.height < 1) return fail(`a highlight is ${rect.width}×${rect.height}`);
        }
        return pass(`${marks.length} highlight rect(s)`);
      },


      'highlights land on their anchored text'() {
        // The strongest available alignment check: take the centre of each highlight, ask the
        // document what is underneath it (the overlay is pointer-events:none, so this reaches the
        // content), and require the text there to be part of the anchor it belongs to.
        const scenario = fixture.scenarios[currentKey];
        const byId = new Map(scenario.review.comments.map((comment) => [comment.id, comment]));
        const scrollY = window.scrollY;
        // Anything painting over the content would answer `elementFromPoint` in its place. The
        // harness bar is `position: fixed` chrome; the header is `position: sticky` and legitimately
        // covers text scrolled under it. `visibility: hidden` keeps both in layout, so hiding them
        // cannot move the very highlights being measured.
        const covering = [document.getElementById('mr-harness'), document.getElementById('header')];
        for (const element of covering) element.style.visibility = 'hidden';
        let checked = 0;

        try {
          for (const mark of document.querySelectorAll('#highlight-overlay .mr-highlight')) {
            const id = mark.getAttribute('data-comment-id');
            const comment = byId.get(id);
            if (!comment) return fail(`highlight for unknown comment ${id}`);

            // Only what is on screen can be hit-tested, so bring each one into view. Highlights are
            // positioned in the overlay's own coordinate space, so scrolling moves them with the
            // text — which is itself the property being checked.
            mark.scrollIntoView({ block: 'center' });
            const rect = mark.getBoundingClientRect();
            const element = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
            if (!element) return fail(`nothing underneath the highlight for ${id}`);
            // In narrow mode the pane's own inline marker sits on the anchor by design, and it is
            // the one thing legitimately allowed to be on top of a highlight.
            if (element.classList.contains('mr-marker')) continue;
            if (!document.getElementById('content').contains(element)) {
              return fail(`highlight for ${id} sits outside #content, over <${element.tagName.toLowerCase()}>`);
            }

            const under = (element.textContent || '').replace(/\s+/g, ' ').trim();
            const exact = comment.anchor.exact.replace(/\s+/g, ' ').trim();
            // Two directions, because what sits under the point depends on the markup. In prose it
            // is the whole block, which should contain a word from the middle of the anchor (a word
            // from the middle, so a near-miss of a few characters still fails). Inside a fence it
            // is one of highlight.js's leaf spans, which should itself be part of the anchor.
            const words = exact.split(' ').filter((word) => word.length > 3);
            const probe = words[Math.floor(words.length / 2)];
            const aligned = (probe && under.includes(probe)) || (under.length > 0 && exact.includes(under));
            if (!aligned) {
              return fail(`highlight for ${id} covers "${under.slice(0, 60)}…", which does not overlap "${exact.slice(0, 40)}…"`);
            }
            checked++;
          }
        } finally {
          for (const element of covering) element.style.visibility = '';
          window.scrollTo({ top: scrollY });
        }
        return pass(`${checked} highlight(s) verified against the text underneath`);
      },

      'uncertain and orphaned render distinctly'() {
        if (currentKey !== 'uncertain') return skip('other scenario');
        const uncertain = document.querySelectorAll('.mr-highlight-uncertain').length;
        // Orphans moved out of the gutter in Phase 4b — they have no anchor to align a card to.
        const orphaned = document.querySelectorAll('#orphans .mr-orphan').length;
        if (uncertain === 0) return fail('no "position uncertain" highlight for the low-confidence anchor');
        if (orphaned === 0) return fail('the orphaned comment is not listed in #orphans');
        return pass(`${uncertain} uncertain highlight(s), ${orphaned} orphan row(s)`);
      },

      'orphans are listed once each and do not overlap'() {
        if (currentKey !== 'orphans') return skip('other scenario');
        // The Plan 04 §9 D6 regression guard. Before orphans moved into their own section every one
        // of them was skipped before `stackTops` ran, so none got a `top` and all three landed on
        // top of each other. This check fails against that code and passes against this.
        const expected = fixture.scenarios.orphans.review.comments.length;
        const rows = [...document.querySelectorAll('#orphans .mr-orphan')];
        if (rows.length !== expected) return fail(`expected ${expected} orphan rows, found ${rows.length}`);

        const ids = new Set(rows.map((row) => row.dataset.commentId));
        if (ids.size !== expected) return fail('the same orphan is listed more than once');

        const rects = rows.map((row) => row.getBoundingClientRect()).sort((a, b) => a.top - b.top);
        for (let i = 1; i < rects.length; i++) {
          if (rects[i].top < rects[i - 1].bottom - 0.5) {
            return fail(`orphan ${i} overlaps the previous row (top ${rects[i].top.toFixed(1)} vs bottom ${rects[i - 1].bottom.toFixed(1)})`);
          }
        }
        // No card should have been left in the gutter for them either.
        if (visibleCards().length > 0) return fail('an orphan is still rendering as a gutter card');
        return pass(`${rows.length} distinct, non-overlapping orphan rows`);
      },

      'addressed cards show a before and after'() {
        if (currentKey !== 'addressed') return skip('other scenario');
        const befores = [...document.querySelectorAll('#gutter .mr-diff-before')];
        const afters = [...document.querySelectorAll('#gutter .mr-diff-after')];
        if (befores.length === 0 || befores.length !== afters.length) {
          return fail(`${befores.length} before(s) against ${afters.length} after(s)`);
        }
        for (const element of [...befores, ...afters]) {
          if ((element.textContent || '').trim().length === 0) return fail('an empty diff line');
        }
        // Colour is the only thing distinguishing them, so it has to actually differ per theme.
        const beforeColour = getComputedStyle(befores[0]).color;
        const afterColour = getComputedStyle(afters[0]).color;
        if (beforeColour === afterColour) {
          return fail(`before and after render the same colour (${beforeColour})`);
        }
        // The UA underlines <ins> by default, which reads as a link.
        if (getComputedStyle(afters[0]).textDecorationLine.includes('underline')) {
          return fail('the "after" line is underlined and reads as a link');
        }
        return pass(`${befores.length} before/after pair(s), ${beforeColour} vs ${afterColour}`);
      },

      'the section-change note lands only on the flagged card'() {
        if (currentKey !== 'nearby') return skip('other scenario');
        const scenario = fixture.scenarios[currentKey];
        const flagged = new Set(scenario.sectionChanged);

        const noted = [...document.querySelectorAll('#gutter .mr-card')].filter((card) => card.querySelector('.mr-card-note'));
        const notedIds = new Set(noted.map((card) => card.dataset.commentId));
        if (notedIds.size !== flagged.size) return fail(`${notedIds.size} card(s) carry the note, expected ${flagged.size}`);
        for (const id of flagged) {
          if (!notedIds.has(id)) return fail(`${id} was flagged but carries no note`);
        }

        // The note must not read as the addressed diff. Those are the evidence for an inference the
        // extension made; this is a weaker claim, and rendering them alike invites confusing the two.
        const note = noted[0].querySelector('.mr-card-note');
        if ((note.textContent || '').trim().length === 0) return fail('the note is empty');
        if (noted[0].querySelector('.mr-diff')) return fail('a flagged open card is also showing a before/after');

        const addressed = document.querySelector('#gutter .mr-card-addressed .mr-diff-before');
        if (!addressed) return fail('the scenario lost its addressed card, so the comparison is untested');
        if (getComputedStyle(note).color === getComputedStyle(addressed).color) {
          return fail('the note renders the same colour as an addressed diff');
        }

        // "Looks good" rather than "Resolve": the user is confirming something, not judging cold.
        const labels = [...noted[0].querySelectorAll('.mr-card-action')].map((button) => button.textContent);
        if (!labels.includes('Looks good')) return fail(`no "Looks good" action, found ${labels.join(', ')}`);
        return pass(`note on ${notedIds.size} of ${scenario.review.comments.length} card(s), distinct from the diff`);
      },

      'the header does not swallow content'() {
        const header = document.getElementById('header');
        if (header.hidden) return fail('the header is hidden despite comments existing');
        if (getComputedStyle(header).position !== 'sticky') return fail('the header is not sticky');

        // Opaque, or text scrolls through it.
        const background = getComputedStyle(header).backgroundColor;
        if (background === 'transparent' || background === 'rgba(0, 0, 0, 0)') {
          return fail('the header background is transparent; content will show through it');
        }

        // Above the highlight overlay, or highlights paint over the bar.
        const headerZ = Number(getComputedStyle(header).zIndex);
        const overlayZ = Number(getComputedStyle(document.getElementById('highlight-overlay')).zIndex);
        if (!(headerZ > overlayZ)) return fail(`header z-index ${headerZ} is not above the overlay's ${overlayZ}`);

        // At the top of the document it must sit above the content, not over it.
        window.scrollTo({ top: 0 });
        const firstBlock = document.querySelector('#content [data-ap-start]');
        if (firstBlock && header.getBoundingClientRect().bottom > firstBlock.getBoundingClientRect().top + 1) {
          return fail('the header overlaps the first block at scroll top');
        }
        return pass(`sticky, opaque, z-index ${headerZ} over ${overlayZ}`);
      },

      'filter chips hide the card and its highlight together'() {
        if (currentKey !== 'filtered') return skip('other scenario');
        // In narrow mode every card is hidden except the expanded one, so `visibleCards()` is
        // already zero and cannot show a change. The highlights still tell the story, but the
        // card half of this assertion only means anything at full width.
        if (document.body.classList.contains('mr-narrow')) return skip('needs the gutter');
        const chip = document.querySelector('#header .mr-chip[data-status="open"]');
        if (!chip) return fail('no "open" filter chip');

        const before = { cards: visibleCards().length, marks: document.querySelectorAll('.mr-highlight').length };
        chip.click();
        const during = { cards: visibleCards().length, marks: document.querySelectorAll('.mr-highlight').length };
        chip.click();
        const after = { cards: visibleCards().length, marks: document.querySelectorAll('.mr-highlight').length };

        if (during.cards >= before.cards) return fail('hiding "open" did not remove a card');
        // A highlight with no card is confusing — the two have to move together.
        if (during.marks >= before.marks) return fail('hiding "open" left its highlight behind');
        if (after.cards !== before.cards || after.marks !== before.marks) {
          return fail(`toggling back did not restore (${after.cards}/${after.marks} vs ${before.cards}/${before.marks})`);
        }
        return pass(`${before.cards} → ${during.cards} cards, ${before.marks} → ${during.marks} highlights`);
      },

      'the rewrite banner offers the diff'() {
        if (currentKey !== 'rewrite') return skip('other scenario');
        const notice = document.getElementById('notice');
        if (notice.hidden) return fail('no banner for a rewritten document');
        const button = notice.querySelector('button');
        if (!button) return fail('the banner has no action');
        if (!/diff/i.test(button.textContent || '')) return fail(`unexpected action "${button.textContent}"`);

        // Existing is not the same as visible. `#notice` used to be the last element in the body,
        // which is fine for the two states that clear the document first — but this one fires over
        // a full one, and a banner below the whole document is a banner nobody reads.
        window.scrollTo({ top: 0 });
        const rect = notice.getBoundingClientRect();
        if (rect.top > window.innerHeight || rect.bottom < 0) {
          return fail(`the banner is off-screen at scroll top (top ${rect.top.toFixed(0)}px, viewport ${window.innerHeight}px)`);
        }
        return pass(`banner on screen with "${button.textContent}"`);
      },

      'resolved comments collapse into a group'() {
        if (currentKey !== 'mixed') return skip('other scenario');
        const group = document.querySelector('#gutter .mr-resolved-group');
        if (!group) return fail('no resolved group rendered');
        return pass(`resolved group present (${group.querySelectorAll('.mr-card').length} inside)`);
      },

      'narrow mode matches the viewport'() {
        const narrow = document.body.classList.contains('mr-narrow');
        const expected = window.innerWidth < 700;
        if (narrow !== expected) return fail(`body.mr-narrow is ${narrow} at ${window.innerWidth}px (expected ${expected})`);
        if (narrow) {
          // A marker is anchored to a highlight, so a scenario with nothing locatable has none by
          // design — its comments are all in `#orphans`, which is in flow and needs no marker.
          if (nothingLocatable()) return skip('every anchor in this scenario is gone');
          // In `#marker-layer`, not the overlay: the overlay is aria-hidden, and a focusable
          // button inside it was unreachable by screen reader (H16).
          if (document.querySelectorAll('#highlight-overlay .mr-marker').length > 0) {
            return fail('markers are inside the aria-hidden overlay');
          }
          const markers = document.querySelectorAll('#marker-layer .mr-marker').length;
          if (markers === 0) return fail('narrow mode with no inline markers');
          return pass(`collapsed to ${markers} inline marker(s)`);
        }
        return pass(`gutter shown at ${window.innerWidth}px`);
      },

      'nothing focusable hides inside an aria-hidden subtree'() {
        // The check that would have caught H16 three phases earlier. Focusable content inside
        // `aria-hidden` is a hard ARIA violation: the element takes keyboard focus while being
        // absent from the accessibility tree, so a screen-reader user lands on nothing.
        const offenders = [];
        for (const hidden of document.querySelectorAll('[aria-hidden="true"]')) {
          for (const element of hidden.querySelectorAll('button, a[href], input, select, textarea, [tabindex]')) {
            if (element.getAttribute('tabindex') === '-1') continue;
            offenders.push(element.className || element.tagName);
          }
        }
        return offenders.length === 0
          ? pass('no focusable elements under aria-hidden')
          : fail(`focusable inside aria-hidden: ${offenders.join(', ')}`);
      },

      'every card announces its status'() {
        // Status reached assistive tech only through a CSS class before H18, so `open`, `orphaned`
        // and `resolved` cards were indistinguishable to a screen reader.
        const cards = [...document.querySelectorAll('#gutter .mr-card')];
        if (cards.length === 0) return skip('no cards in this scenario');
        const bare = cards.filter((card) => !card.getAttribute('aria-label'));
        if (bare.length > 0) return fail(`${bare.length} card(s) with no accessible name`);
        const statuses = ['open', 'addressed', 'anchor lost', 'resolved'];
        const unnamed = cards.filter(
          (card) => !statuses.some((status) => card.getAttribute('aria-label').includes(status)),
        );
        return unnamed.length === 0
          ? pass(`${cards.length} card(s) name their status`)
          : fail(`${unnamed.length} card(s) do not name a status`);
      },

      'an uncertain position says so in words'() {
        // PRD §5 requires the phrase, not just the dashed underline (H17).
        if (currentKey !== 'uncertain') return skip('other scenario');
        const uncertain = [...document.querySelectorAll('#gutter .mr-card')].filter((card) =>
          card.textContent.includes('position uncertain'),
        );
        return uncertain.length > 0
          ? pass(`${uncertain.length} card(s) say "position uncertain"`)
          : fail('the low-confidence card never says "position uncertain"');
      },

      'no uncaught errors'() {
        return window.__ERRORS__.length === 0 ? pass('clean') : fail(window.__ERRORS__.join(' | '));
      },
    };

    function runChecks() {
      log.replaceChildren();
      write(`— ${fixture.scenarios[currentKey].label} @ ${window.innerWidth}×${window.innerHeight}, theme ${document.documentElement.dataset.theme || 'dark'}`);
      let failed = 0;
      for (const [name, check] of Object.entries(checks)) {
        let result;
        try {
          result = check();
        } catch (error) {
          result = fail(`threw: ${String(error && error.stack || error)}`);
        }
        if (result.verdict === 'FAIL') failed++;
        write(`${result.verdict}  ${name}: ${result.detail}`, result.verdict === 'FAIL' ? 'fail' : 'pass');
      }
      write(failed === 0 ? 'ALL CHECKS PASSED' : `${failed} CHECK(S) FAILED`, failed === 0 ? 'pass' : 'fail');
    }

    // ---- gestures ---------------------------------------------------------------------------
    //
    // The create flow and the manual re-anchor are the two acceptance items that are *interactions*
    // rather than states: select text, get a button, get a popover, submit. Both live entirely in
    // the webview, so both are drivable here — which is the difference between an item a human has
    // to remember to check and one a machine does.
    //
    // Async, unlike `checks`, because `selection.ts` debounces `selectionchange` by 150 ms. Results
    // go to the same log.

    const SELECTION_SETTLE_MS = 260;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    /** A range over the first text node containing `needle`, without disturbing the selection. */
    function rangeFor(needle) {
      const walker = document.createTreeWalker(document.getElementById('content'), NodeFilter.SHOW_TEXT);
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        const at = node.textContent.indexOf(needle);
        if (at === -1) continue;
        const range = document.createRange();
        range.setStart(node, at);
        range.setEnd(node, at + needle.length);
        return range;
      }
      return null;
    }

    /** Selects the first text node containing `needle`, exactly as a drag would. */
    function selectText(needle) {
      const range = rangeFor(needle);
      if (!range) return false;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      return true;
    }

    /**
     * A range over the document's last substantial passage. Picked by position rather than by text
     * so the bottom-edge gesture keeps working when the fixture changes — and because only the tail
     * of the document can actually be scrolled against the fold.
     */
    function lastSelectableRange() {
      const walker = document.createTreeWalker(document.getElementById('content'), NodeFilter.SHOW_TEXT);
      let last = null;
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        if (node.textContent.trim().length > 25) last = node;
      }
      if (!last) return null;
      const range = document.createRange();
      range.setStart(last, last.textContent.search(/\S/));
      range.setEnd(last, last.textContent.trimEnd().length);
      return range;
    }

    function selectRange(range) {
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function clearSelection() {
      window.getSelection().removeAllRanges();
    }

    const floatingButton = () => document.querySelector('.mr-selection-button');
    const popoverEl = () => document.querySelector('.mr-popover');
    const lastPosted = (type) => [...window.__POSTED__].reverse().find((m) => m.type === type);

    async function gestureCreateFlow() {
      const needle = 'validates every incoming bearer token';
      const before = window.__POSTED__.length;

      if (!selectText(needle)) return fail(`could not find ${needle} in the rendered document`);
      await wait(SELECTION_SETTLE_MS);

      const button = floatingButton();
      if (!button || button.hidden) return fail('no floating button appeared for a valid selection');

      button.click();
      const popover = popoverEl();
      if (!popover || popover.hidden) return fail('clicking the button did not open the popover');

      const textarea = popover.querySelector('.mr-popover-input');
      const submit = [...popover.querySelectorAll('button')].find((b) => b.textContent === 'Comment');
      if (!textarea || !submit) return fail('the popover is missing its input or its submit button');
      if (!submit.disabled) return fail('submit is enabled with an empty body');

      textarea.value = 'Does this cover expired keys?';
      textarea.dispatchEvent(new Event('input'));
      if (submit.disabled) return fail('submit stayed disabled after typing');

      submit.click();
      const posted = lastPosted('addComment');
      if (!posted) return fail('submitting posted no addComment message');
      if (posted.body !== 'Does this cover expired keys?') return fail(`body came through as ${JSON.stringify(posted.body)}`);
      if (posted.selectedText !== needle) return fail(`selectedText came through as ${JSON.stringify(posted.selectedText)}`);

      // The offset is the whole point of anchor space: it must land on the text, not near it.
      const expected = fixture.plainText.indexOf(needle);
      if (posted.offset !== expected) return fail(`offset ${posted.offset}, expected ${expected}`);
      if (popoverEl() && !popoverEl().hidden) return fail('the popover stayed open after submitting');
      if (window.__POSTED__.length <= before) return fail('nothing was posted at all');

      clearSelection();
      return pass(`selection -> button -> popover -> addComment at offset ${posted.offset}`);
    }

    /** The orphan row for `id`, re-read from the DOM: `setArmed` re-renders the section. */
    const orphanRow = (id) =>
      id
        ? document.querySelector(`#orphans [data-comment-id="${id}"]`)
        : document.querySelector('#orphans [data-comment-id]');

    const actionOn = (row, label) =>
      row && [...row.querySelectorAll('button')].find((b) => b.textContent === label);

    async function gestureReanchor() {
      const first = orphanRow();
      if (!first) return fail('no orphan rows to re-anchor (wrong scenario?)');
      const id = first.dataset.commentId;

      const arm = actionOn(first, 'Re-anchor');
      if (!arm) return fail('no Re-anchor action on the orphan row');
      arm.click();

      if (!actionOn(orphanRow(id), 'Cancel')) return fail('arming did not turn the action into Cancel');

      const needle = 'Tokens are validated at the edge';
      if (!selectText(needle)) return fail(`could not find ${needle} in the rendered document`);
      await wait(SELECTION_SETTLE_MS);

      const button = floatingButton();
      if (!button || button.hidden) return fail('no floating button while armed');
      if (button.textContent !== 'Re-anchor here') return fail(`button reads ${JSON.stringify(button.textContent)} while armed`);

      button.click();
      // No popover: the comment already has a body, and asking again would imply it is being replaced.
      if (popoverEl() && !popoverEl().hidden) return fail('a popover opened during a re-anchor');

      const posted = lastPosted('reanchorComment');
      if (!posted) return fail('committing posted no reanchorComment message');
      if (posted.id !== id) return fail(`posted id ${posted.id}, expected ${id}`);
      if (posted.selectedText !== needle) return fail(`selectedText came through as ${JSON.stringify(posted.selectedText)}`);

      clearSelection();
      return pass(`arm -> select -> commit, reanchorComment for ${id}`);
    }

    async function gestureEscapeDisarms() {
      const first = orphanRow();
      if (!first) return fail('no orphan rows (wrong scenario?)');
      const id = first.dataset.commentId;

      const arm = actionOn(first, 'Re-anchor');
      if (!arm) return fail('no Re-anchor action on the orphan row');
      arm.click();
      if (!actionOn(orphanRow(id), 'Cancel')) return fail('arming did not take');

      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

      if (actionOn(orphanRow(id), 'Cancel')) return fail('Escape did not disarm');
      return pass('Escape disarms cleanly');
    }

    /**
     * §10 D20: the popover is `position: fixed` and used to be placed at `rect.bottom + 8` with no
     * bottom clamp, so a selection near the fold pushed Cancel/Comment off screen — unreachable,
     * because a fixed element does not scroll back into view. Asserts the whole popover, and the
     * actions row specifically, stay inside the viewport.
     */
    async function gesturePopoverClamped() {
      const GAP = 40;

      const target = lastSelectableRange();
      if (!target) return fail('no selectable text in the rendered document');

      // Scroll first: the floating UI is placed from the rect captured at selection time.
      window.scrollBy(0, target.getBoundingClientRect().bottom - (window.innerHeight - GAP));
      selectRange(target);
      await wait(SELECTION_SETTLE_MS);

      // A selection that never reached the fold would pass this gesture against the D20 code too.
      const selected = window.getSelection().getRangeAt(0).getBoundingClientRect();
      const aboveFold = Math.round(window.innerHeight - selected.bottom);
      if (aboveFold > 120) {
        return fail(`selection sits ${aboveFold}px above the fold — too far to exercise the edge`);
      }

      const button = floatingButton();
      if (!button || button.hidden) return fail('no floating button for a selection near the bottom edge');

      button.click();
      const popover = popoverEl();
      if (!popover || popover.hidden) return fail('clicking the button did not open the popover');

      const inside = (rect, what) => {
        if (rect.top < 0) return `${what} top at ${Math.round(rect.top)}, above the viewport`;
        if (rect.bottom > window.innerHeight) return `${what} bottom at ${Math.round(rect.bottom)}, past ${window.innerHeight}`;
        if (rect.left < 0) return `${what} left at ${Math.round(rect.left)}, off the left edge`;
        if (rect.right > window.innerWidth) return `${what} right at ${Math.round(rect.right)}, past ${window.innerWidth}`;
        return null;
      };

      const popoverProblem = inside(popover.getBoundingClientRect(), 'popover');
      if (popoverProblem) return fail(popoverProblem);

      // The actions row is what D20 actually cost the user: a composer that cannot be submitted.
      const actions = popover.querySelector('.mr-popover-actions');
      if (!actions) return fail('the popover has no actions row');
      const actionsProblem = inside(actions.getBoundingClientRect(), 'Cancel/Comment row');
      if (actionsProblem) return fail(actionsProblem);

      popover.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      clearSelection();
      window.scrollTo(0, 0);
      return pass(`popover and actions on screen for a selection ${aboveFold}px above the fold`);
    }

    const gestures = {
      'create flow: select, comment, submit': gestureCreateFlow,
      'manual re-anchor: arm, select, commit': gestureReanchor,
      'manual re-anchor: Escape disarms': gestureEscapeDisarms,
      'popover: clamped to the viewport': gesturePopoverClamped,
    };

    async function runGestures() {
      // Both gestures need orphans on screen and a document behind them.
      const previous = currentKey;
      loadScenario('orphans');
      await wait(SELECTION_SETTLE_MS);

      log.replaceChildren();
      write(`— gestures @ ${window.innerWidth}x${window.innerHeight}`);
      let failed = 0;
      for (const [name, gesture] of Object.entries(gestures)) {
        let result;
        try {
          result = await gesture();
        } catch (error) {
          result = fail(`threw: ${String((error && error.stack) || error)}`);
        }
        if (result.verdict === 'FAIL') failed++;
        write(`${result.verdict}  ${name}: ${result.detail}`, result.verdict === 'FAIL' ? 'fail' : 'pass');
      }
      write(failed === 0 ? 'ALL GESTURES PASSED' : `${failed} GESTURE(S) FAILED`, failed === 0 ? 'pass' : 'fail');
      loadScenario(previous);
      return failed;
    }

    document.getElementById('mr-gestures').addEventListener('click', () => { void runGestures(); });
    window.__RUN_GESTURES__ = runGestures;

    document.getElementById('mr-check').addEventListener('click', runChecks);
    // Exposed so the browser automation can run them without clicking.
    window.__RUN_CHECKS__ = runChecks;
    window.addEventListener('resize', () => { window.__RESIZED__ = true; });

    write('harness ready — pick a scenario, then Run checks');
  })();
  </script>
</body>
</html>
